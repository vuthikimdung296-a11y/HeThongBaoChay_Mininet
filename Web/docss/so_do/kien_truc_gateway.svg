<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1600" height="800" fill="#fff"/><defs><marker id="m1E8E4E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E4E"/></marker><marker id="mC93A3A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C93A3A"/></marker><marker id="m6A4FA3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6A4FA3"/></marker><marker id="mD98A00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D98A00"/></marker><marker id="m5B6570" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B6570"/></marker></defs><rect x="20" y="60" width="230" height="110" rx="16" fill="#EEF1F5" stroke="#5B6570" stroke-width="2"/><text x="135.0" y="86" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Cảm biến khói/nhiệt ×300</text><text x="135.0" y="108" font-size="14" text-anchor="middle" fill="#333">VLAN 10 · MQTT TCP 1883</text><text x="135.0" y="128" font-size="14" text-anchor="middle" fill="#333">Báo cháy: DSCP 48 (CS6), QoS 1</text><text x="135.0" y="148" font-size="14" text-anchor="middle" fill="#333">Telemetry: DSCP 0, 30 s/lần</text><rect x="20" y="200" width="230" height="100" rx="16" fill="#EEF1F5" stroke="#5B6570" stroke-width="2"/><text x="135.0" y="226" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Camera IP ×20</text><text x="135.0" y="248" font-size="14" text-anchor="middle" fill="#333">VLAN 20 · RTSP/UDP</text><text x="135.0" y="268" font-size="14" text-anchor="middle" fill="#333">~4 Mbps/camera (≈80 Mbps)</text><rect x="285" y="110" width="110" height="130" rx="16" fill="#EEF1F5" stroke="#5B6570" stroke-width="2"/><text x="340.0" y="136" font-size="15" font-weight="700" text-anchor="middle" fill="#222">OVS s1</text><text x="340.0" y="158" font-size="13" text-anchor="middle" fill="#333">Switch ảo</text><text x="340.0" y="177" font-size="13" text-anchor="middle" fill="#333">VLAN access</text><text x="340.0" y="196" font-size="13" text-anchor="middle" fill="#333">trunk → gw</text><rect x="20" y="430" width="230" height="110" rx="16" fill="#FBE4E4" stroke="#C93A3A" stroke-width="2"/><text x="135.0" y="456" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Kẻ tấn công (mạng ngoài)</text><text x="135.0" y="478" font-size="14" text-anchor="middle" fill="#333">192.168.100.100</text><text x="135.0" y="498" font-size="14" text-anchor="middle" fill="#333">SYN Flood / UDP Flood</text><text x="135.0" y="518" font-size="14" text-anchor="middle" fill="#333">có thể giả mạo IP nguồn</text><rect x="430" y="20" width="930" height="760" rx="20" fill="#F7F9FC" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="8 5"/><text x="1344" y="766" font-size="14" text-anchor="end" fill="#6B7580">EDGE GATEWAY (nút gw trong Mininet · Ubuntu)</text><rect x="450" y="42" width="220" height="34" rx="16" fill="#F7F9FC" stroke="#9AA5B1" stroke-width="2"/><text x="560.0" y="65" font-size="14" font-weight="700" text-anchor="middle" fill="#222">GIAI ĐOẠN 1 · Tiếp nhận</text><rect x="700" y="42" width="270" height="34" rx="16" fill="#FFF1D6" stroke="#D98A00" stroke-width="2"/><text x="835.0" y="65" font-size="14" font-weight="700" text-anchor="middle" fill="#222">GIAI ĐOẠN 2 · Edge AI phân loại</text><rect x="1000" y="42" width="340" height="34" rx="16" fill="#E2F3E9" stroke="#1E8E4E" stroke-width="2"/><text x="1170.0" y="65" font-size="14" font-weight="700" text-anchor="middle" fill="#222">GIAI ĐOẠN 3 · Tường lửa &amp; QoS</text><rect x="450" y="110" width="220" height="450" rx="16" fill="#F7F9FC" stroke="#9AA5B1" stroke-width="2"/><text x="560.0" y="136" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Thu thập lưu lượng vào</text><text x="560.0" y="158" font-size="14" text-anchor="middle" fill="#333"></text><text x="560.0" y="178" font-size="14" text-anchor="middle" fill="#333">gw-eth0: trunk VLAN 10/20/30</text><text x="560.0" y="198" font-size="14" text-anchor="middle" fill="#333">(cảm biến, camera, máy chủ)</text><text x="560.0" y="218" font-size="14" text-anchor="middle" fill="#333"></text><text x="560.0" y="238" font-size="14" text-anchor="middle" fill="#333">gw-eth1: phía mạng ngoài</text><text x="560.0" y="258" font-size="14" text-anchor="middle" fill="#333">(kẻ tấn công)</text><text x="560.0" y="278" font-size="14" text-anchor="middle" fill="#333"></text><text x="560.0" y="298" font-size="14" text-anchor="middle" fill="#333">Chỉ bắt chiều VÀO</text><text x="560.0" y="318" font-size="14" text-anchor="middle" fill="#333">(AF_PACKET), bỏ gói do</text><text x="560.0" y="338" font-size="14" text-anchor="middle" fill="#333">chính Gateway gửi ra</text><text x="560.0" y="358" font-size="14" text-anchor="middle" fill="#333">→ mỗi gói chỉ đếm 1 lần</text><rect x="720" y="125" width="230" height="80" rx="16" fill="#FFFFFF" stroke="#D98A00" stroke-width="2"/><text x="835.0" y="151" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Trích header metadata</text><text x="835.0" y="173" font-size="13" text-anchor="middle" fill="#333">IP nguồn, độ dài IP, giao thức,</text><text x="835.0" y="192" font-size="13" text-anchor="middle" fill="#333">cờ SYN/ACK · KHÔNG đọc payload</text><rect x="720" y="225" width="230" height="90" rx="16" fill="#FFFFFF" stroke="#D98A00" stroke-width="2"/><text x="835.0" y="251" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Cửa sổ thời gian 1 giây</text><text x="835.0" y="273" font-size="13" text-anchor="middle" fill="#333">packet_rate · byte_rate</text><text x="835.0" y="292" font-size="13" text-anchor="middle" fill="#333">syn_count · ip_dispersion</text><rect x="720" y="335" width="230" height="100" rx="16" fill="#FFFFFF" stroke="#D98A00" stroke-width="2"/><text x="835.0" y="361" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Random Forest (4 đặc trưng)</text><text x="835.0" y="383" font-size="13" text-anchor="middle" fill="#333">Xác suất tấn công ≥ 0,5</text><text x="835.0" y="402" font-size="13" text-anchor="middle" fill="#333">làm mượt: 2 cửa sổ bật / 3 tắt,</text><text x="835.0" y="421" font-size="13" text-anchor="middle" fill="#333">giữ nhãn tấn công ≥ 10 s</text><polygon points="835.0,460 935,500.0 835.0,540 735,500.0" fill="#FFF1D6" stroke="#D98A00" stroke-width="2"/><text x="835.0" y="506.0" font-size="15" font-weight="700" text-anchor="middle" fill="#333">Nhãn?</text><rect x="1000" y="110" width="340" height="185" rx="16" fill="#FBE4E4" stroke="#C93A3A" stroke-width="2"/><text x="1170.0" y="136" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Module Tường lửa (nftables / iptables)</text><text x="1170.0" y="158" font-size="14" text-anchor="middle" fill="#333"></text><text x="1170.0" y="178" font-size="14" text-anchor="middle" fill="#333">Nhãn TẤN CÔNG → chặn IP nguồn</text><text x="1170.0" y="198" font-size="14" text-anchor="middle" fill="#333">đáng ngờ (hoặc giới hạn tốc độ)</text><text x="1170.0" y="218" font-size="14" text-anchor="middle" fill="#333">Phản ứng ≤ 3 giây</text><text x="1170.0" y="238" font-size="14" text-anchor="middle" fill="#333">Luật đặt ở prerouting nên chặn</text><text x="1170.0" y="258" font-size="14" text-anchor="middle" fill="#333">trước khi gói vào hàng đợi QoS</text><rect x="1000" y="325" width="340" height="265" rx="16" fill="#E2F3E9" stroke="#1E8E4E" stroke-width="2"/><text x="1170.0" y="351" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Module điều tiết QoS</text><text x="1170.0" y="373" font-size="13" text-anchor="middle" fill="#333">nft đánh dấu (mark) theo cổng vào + DSCP</text><text x="1170.0" y="392" font-size="13" text-anchor="middle" fill="#333">→ HTB trên gw-eth0.30 + FQ-CoDel mỗi lớp</text><text x="1170.0" y="411" font-size="13" text-anchor="middle" fill="#333"></text><text x="1170.0" y="430" font-size="13" text-anchor="middle" fill="#333">0x10 Báo cháy (DSCP 48): ≥10 Mbit, ưu tiên 0</text><text x="1170.0" y="449" font-size="13" text-anchor="middle" fill="#333">0x11 Telemetry cảm biến: ≥5 Mbit, ưu tiên 1</text><text x="1170.0" y="468" font-size="13" text-anchor="middle" fill="#333">0x12 Camera: ≥60 Mbit (trần 90), ưu tiên 2</text><text x="1170.0" y="487" font-size="13" text-anchor="middle" fill="#333">0x13 Không tin cậy / gw-eth1: 1 Mbit (trần 10)</text><rect x="720" y="640" width="240" height="100" rx="16" fill="#EDE7F6" stroke="#6A4FA3" stroke-width="2"/><text x="840.0" y="666" font-size="15" font-weight="700" text-anchor="middle" fill="#222">live_metrics.json (mỗi 1 s)</text><text x="840.0" y="688" font-size="13" text-anchor="middle" fill="#333">timestamp, normal/syn/udp_packets,</text><text x="840.0" y="707" font-size="13" text-anchor="middle" fill="#333">rtt_ms, status, blocked_ips</text><rect x="1400" y="400" width="190" height="130" rx="16" fill="#E3EDFA" stroke="#2B6CB0" stroke-width="2"/><text x="1495.0" y="426" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Máy chủ srv · VLAN 30</text><text x="1495.0" y="448" font-size="14" text-anchor="middle" fill="#333">10.0.30.10</text><text x="1495.0" y="468" font-size="14" text-anchor="middle" fill="#333">MQTT broker Mosquitto</text><text x="1495.0" y="488" font-size="14" text-anchor="middle" fill="#333">Dashboard / cảnh báo</text><rect x="1400" y="150" width="190" height="90" rx="16" fill="#FBE4E4" stroke="#C93A3A" stroke-width="2"/><text x="1495.0" y="176" font-size="16" font-weight="700" text-anchor="middle" fill="#222">Gói tấn công bị loại</text><text x="1495.0" y="198" font-size="14" text-anchor="middle" fill="#333">(DROP)</text><rect x="1400" y="640" width="190" height="100"